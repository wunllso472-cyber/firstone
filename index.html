<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Tricycle Ride</title>
<style>
  :root {
    --bg: #f4efe6;
    --panel: #fffaf2;
    --ink: #2b2622;
    --muted: #7a6f64;
    --accent: #d9692a;
    --accent-ink: #ffffff;
    --line: #e2d6c4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916;
      --panel: #26231f;
      --ink: #f1e9dd;
      --muted: #a89c8d;
      --accent: #f0934b;
      --accent-ink: #1b1916;
      --line: #3b352e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916;
    --panel: #26231f;
    --ink: #f1e9dd;
    --muted: #a89c8d;
    --accent: #f0934b;
    --accent-ink: #1b1916;
    --line: #3b352e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
  .stage {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
    background: #a9d8f0;
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center;
    margin-top: 16px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button, .solo {
    font: inherit; font-size: .92rem; color: var(--ink); background: transparent;
    border: 0; padding: 8px 14px; cursor: pointer; min-height: 38px;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg button:focus-visible, .solo:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .solo { border: 1px solid var(--line); border-radius: 10px; }
  .readout { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
  .hint { color: var(--muted); font-size: .82rem; margin: 10px 2px 0; }
  kbd { font-family: ui-monospace, monospace; font-size: .78rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  @media (max-width: 560px) { .readout { margin-left: 0; width: 100%; } .seg button { padding: 8px 10px; } }
</style>
</head>
<body>
<main>
  <h1>Cat on a Tricycle</h1>
  <p class="sub">A tabby pedals along a dirt path at the foot of the mountains. Switch the camera and set the pace.</p>

  <div class="stage">
    <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="Animated cat riding a tricycle along a mountain path">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5fb0e5"/>
          <stop offset=".62" stop-color="#a9d8f0"/>
          <stop offset="1" stop-color="#fbe3c0"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#fff6d0" stop-opacity=".9"/>
          <stop offset="1" stop-color="#fff6d0" stop-opacity="0"/>

        <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9aaecb"/>
          <stop offset=".6" stop-color="#b3c3da"/>
          <stop offset="1" stop-color="#c9d5e4"/>
        </linearGradient>
        <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6d8fa9"/>
          <stop offset="1" stop-color="#8fb0b8"/>
        </linearGradient>
        <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f6e6cc" stop-opacity="0"/>
          <stop offset=".5" stop-color="#f6e6cc" stop-opacity=".65"/>
          <stop offset="1" stop-color="#f6e6cc" stop-opacity="0"/>
        </linearGradient>

        <!-- Scenery templates, drawn about 100 units tall, standing on (0,0) -->

            <path id="bTreadR" d="M515,366 L515,432" stroke="#454545" stroke-width="14" stroke-dasharray="5 7"/>
            <circle cx="285" cy="397" r="5" fill="#d8d8d8"/>
            <circle cx="515" cy="397" r="5" fill="#d8d8d8"/>
            <path d="M476,392 L488,148" stroke="#6a6a6a" stroke-width="3"/>
            <path id="bFlag" fill="#ffb300"/>
            <ellipse cx="400" cy="338" rx="40" ry="9" fill="#222"/>
            <g id="bBar"></g>

            <!-- body from behind -->
            <path d="M343,342 C333,300 350,256 400,249 C450,256 467,300 457,342 Z" fill="#e8913a"/>
            <path d="M366,279 Q400,269 434,279 M359,301 Q400,289 441,301 M357,322 Q400,310 443,322" stroke="#b8641f" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path id="bTail" fill="none" stroke="#e8913a" stroke-width="15" stroke-linecap="round"/>

            <!-- grips, arms and paws are drawn per frame -->
            <g id="bArms"></g>

            <!-- head from behind -->
            <polygon points="360,214 365,158 396,194" fill="#e8913a"/>
            <polygon points="440,214 435,158 404,194" fill="#e8913a"/>
            <polygon points="366,196 368,168 385,190" fill="#c9772c"/>
            <polygon points="434,196 432,168 415,190" fill="#c9772c"/>
            <circle cx="400" cy="210" r="44" fill="#e8913a"/>
            <path d="M385,172 Q389,184 386,197 M400,168 L400,196 M415,172 Q411,184 414,197" stroke="#b8641f" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M358,226 L326,220 M358,232 L324,236 M442,226 L474,220 M442,232 L476,236" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
            </g>
          </g>
        </g>

        <!-- cat's own eyes -->
        <g id="fpvRig">
          <g id="fBar"><g transform="translate(0,-24)">
            <rect x="382" y="394" width="36" height="110" rx="16" fill="#262626"/>
            <path id="fTread" d="M400,398 L400,500" stroke="#3f3f3f" stroke-width="22" stroke-dasharray="6 9"/>

            <path d="M128,434 C210,374 320,374 400,374 C480,374 590,374 672,434" fill="none" stroke="#7d848b" stroke-width="17" stroke-linecap="round"/>

            <circle cx="470" cy="362" r="14" fill="#cfd4d9"/>
            <circle cx="466" cy="358" r="5" fill="#fff" opacity=".8"/>
            <path d="M482,358 l10,-6" stroke="#8a9096" stroke-width="4" stroke-linecap="round"/>
            <use href="#fArmL"/>
            <use href="#fArmL" transform="translate(800,0) scale(-1,1)"/>
            <g id="fStreamL"></g>
            <g id="fStreamR"></g>
          </g></g>
          <g id="fWhiskers" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".75">

            <path d="M-5,336 Q60,330 118,338"/>
            <path d="M-5,354 Q52,354 104,366"/>
            <path d="M805,318 Q745,306 688,312"/>
            <path d="M805,336 Q740,330 682,338"/>

  <div class="controls">
    <div class="group">
      <span class="label">View</span>
      <div class="seg" id="viewSeg">

        <button data-view="behind">Behind</button>
        <button data-view="side">Side</button>
      </div>
    </div>
    <div class="group">
      <span class="label">Speed</span>
      <div class="seg" id="speedSeg">
        <button data-speed="slow">Slow</button>
        <button data-speed="medium">Medium</button>
        <button data-speed="fast">Fast</button>
      </div>
    </div>
    <button class="solo" id="pauseBtn">Pause</button>
    <span class="readout" id="readout"></span>
  </div>
  <p class="hint">Keys: <kbd>1</kbd> first-person · <kbd>2</kbd> behind · <kbd>3</kbd> side · <kbd>↑</kbd>/<kbd>↓</kbd> speed · <kbd>Space</kbd> pause</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const mod = (a, n) => ((a % n) + n) % n;
  const f1 = v => v.toFixed(1);
  const deg = r => r * 180 / Math.PI;

  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // ---------- Terrain generation (periodic over 800px so layers tile) ----------
  const W = 800, SPAN = 2400;
  const FAR = [{ n: 2, a: 95, p: 0.3 }, { n: 5, a: 40, p: 1.1 }, { n: 13, a: 12, p: 0.5 }];
  const MID = [{ n: 3, a: 55, p: 1.7 }, { n: 7, a: 22, p: 0.2 }, { n: 17, a: 7, p: 2.0 }];
  const HILL = [{ n: 3, a: 20, p: 0.4, s: 1 }, { n: 8, a: 9, p: 1.3, s: 1 }];
  const scaled = (comps, k) => comps.map(c => ({ ...c, a: c.a * k }));

  function hAt(x, comps) {
    let h = 0;
    for (const c of comps) {
      const u = Math.PI * c.n * x / W + c.p;
      h += c.s ? c.a * (1 + Math.sin(2 * u)) / 2 : c.a * Math.pow(1 - Math.abs(Math.sin(u)), 1.4);
    }
    return h;
  }
  function ridgeD(base, comps) {
    let s = `M0,${base + 400}`;
    for (let x = 0; x <= SPAN; x += 5) s += `L${x},${f1(base - hAt(x, comps))}`;
    return s + `L${SPAN},${base + 400}Z`;
  }
  function snowD(y) {
    let s = `M0,-600L${SPAN},-600`;
    for (let x = SPAN; x >= 0; x -= 8) {
      s += `L${x},${f1(y + 6 * Math.sin(2 * Math.PI * 9 * x / W) + 4 * Math.sin(2 * Math.PI * 23 * x / W + 1))}`;
    }
    return s + 'Z';
  }
  function mountainLayer(id, base, comps, fill, snowY) {
    const d = ridgeD(base, comps);
    let s = `<path d="${d}" fill="${fill}"/>`;
    if (snowY != null) {
      s += `<clipPath id="${id}"><path d="${d}"/></clipPath>` +
           `<path d="${snowD(snowY)}" fill="#f3f6fb" clip-path="url(#${id})"/>`;
    }
    return s;
  }
  const use = (tpl, x, y, sc, extra = '') =>
    `<use href="#${tpl}" transform="translate(${f1(x)},${f1(y)}) scale(${sc.toFixed(3)})"${extra}/>`;
  const tiled = (fn) => { let s = ''; for (let k = 0; k < 3; k++) s += fn(k * W); return s; };

  function cloudsMarkup() {
    const spots = [[80, 70, 1], [330, 48, .7], [560, 118, .85], [820, 62, 1.1]];
    let s = '';
    for (let k = 0; k < 2; k++) for (const [x, y, sc] of spots) s += use('tCloud', x + k * 1000, y, sc);
    return s;
  }

  // ---------- Build side view layers ----------
  $('sClouds').innerHTML = cloudsMarkup();
  $('sFar').innerHTML = mountainLayer('clipSF', 335, FAR, 'url(#gFar)', 228);

        if (r1 < 0.38) { tpl = 'tPine'; size = 38 + r3 * 30; }
        else if (r1 < 0.62) { tpl = 'tTree'; size = 34 + r3 * 18; }
        else if (r1 < 0.75) { tpl = 'tRock'; size = 5 + r3 * 6; }
        else { tpl = 'tFlowers'; size = 3 + r3 * 2; }
        const x = px(X, z);
        const sc = P.f * size / z / 100;
        if (x < -150 * sc - 100 || x > 900 + 150 * sc) continue;
        o += use(tpl, x, y, sc, fade < 1 ? ` opacity="${fade.toFixed(2)}"` : '');
      }
      // small tufts hugging the path edge
      if (z < 500) {
        const r = hash(n + 0.5), side = r < 0.5 ? -1 : 1;
        o += use(r < 0.25 || r > 0.8 ? 'tFlowers' : 'tTuft', px(side * (RW + 4 + r * 6), z), y, P.f * 2.5 / z / 100);
      }
    }
    pEls.objects.innerHTML = o;

    if (view === 'behind') renderBehindRider(theta, ph);
    else renderFpvRider(theta, ph);
  }

  function renderBehindRider(theta, ph) {
    // the tricycle stays level; the cat rocks on the seat as it pedals
    const bob = -1.6 * Math.abs(Math.sin(theta)), roll = 1.8 * Math.sin(theta);
    const sway = basis([400, 340 + bob], roll);
    const swayAttr = `translate(0,${f1(bob)}) rotate(${roll.toFixed(2)},400,340)`;
    pEls.bSway.forEach(e => e.setAttribute('transform', swayAttr));
    const body = p => sway([p[0] - 400, p[1] - 340]);
    const off = f1(-mod(dist * 0.9, 12));
    pEls.bTreadL.setAttribute('stroke-dashoffset', off);
    pEls.bTreadR.setAttribute('stroke-dashoffset', off);

    const fL = 362 + 9 * Math.sin(theta), fR = 362 - 9 * Math.sin(theta);
    const leg = (hx, fx, fy) =>
      `<path d="M${pt(body([hx, 330]))} L${fx},${f1(fy)}" stroke="#e8913a" stroke-width="16" stroke-linecap="round"/>` +
      `<rect x="${fx - 11}" y="${f1(fy + 4)}" width="22" height="5" rx="2" fill="#555"/>` +
      `<ellipse cx="${fx}" cy="${f1(fy)}" rx="10" ry="7" fill="#f3a95b"/>`;
    pEls.bLegs.innerHTML = leg(370, 377, fL) + leg(430, 423, fR);

    // handlebar with a small steering wobble; grips sweep back so outer ends sit lower
    const steer = 1.3 * Math.sin(theta + 0.6);
    const gL = basis([319, 282 + steer], -6), gR = basis([481, 282 - steer], 6, -1);
    pEls.bBar.innerHTML =
      `<path d="M${pt(gL([17, 0]))}Q370,287 400,289Q430,287 ${pt(gR([17, 0]))}" fill="none" stroke="#8f969d" stroke-width="8" stroke-linecap="round"/>` +
      `<path d="M${pt(gL([17, -2]))}Q370,285 400,287Q430,285 ${pt(gR([17, -2]))}" fill="none" stroke="#dfe3e7" stroke-width="2.2" stroke-linecap="round"/>`;
    let arms = `<g transform="${gL.attr}">${B_GRIP}</g><g transform="${gR.attr}">${B_GRIP}</g>`;
    for (const [g, sh, hint] of [[gL, [366, 262], [346, 296]], [gR, [434, 262], [454, 296]]]) {
      const S = body(sh), Wr = g([2.5, 6.5]);
      arms += armMarkup(S, ikHint(S, Wr, 26, 24, hint), Wr, 17, 14, '#e8913a', '#b8641f');
    }
    arms += `<g transform="${gL.attr}">${B_PAW}</g><g transform="${gR.attr}">${B_PAW}</g>`;
    pEls.bArms.innerHTML = arms;

    const sw = 10 * Math.sin(t * 2.2);
    const tail = `M400,336 C446,344 ${f1(470 + sw * .3)},318 ${f1(462 + sw * .6)},286 S${f1(470 + sw)},252 ${f1(488 + sw * 1.4)},240`;
    pEls.bTail.setAttribute('d', tail);
    pEls.bTailTip.setAttribute('d', tail);

    const scarf = [];
    for (let i = 0; i <= 6; i++) scarf.push([424 + i * 6 + 7 * Math.sin(ph - i * 0.9) * i / 6, 252 + i * 10]);
    pEls.bScarf.setAttribute('d', ribbon(scarf, 13, 8));
    const flag = [];
    for (let i = 0; i <= 6; i++) flag.push([487 + i * 7, 160 + 4 * Math.sin(ph - i * 0.9) * i / 6]);
    pEls.bFlag.setAttribute('d', ribbon(flag, 22, 1));
  }

  function renderFpvRider(theta, ph) {
    const bob = 2.2 * Math.abs(Math.sin(theta)) - 1.1;
    pEls.fBar.setAttribute('transform', `translate(${f1(2.5 * Math.sin(theta))},${f1(bob * 0.7)}) rotate(${(1.8 * Math.sin(theta + 0.6)).toFixed(2)},400,470)`);
    pEls.fTread.setAttribute('stroke-dashoffset', f1(mod(dist * 1.2, 15)));
    pEls.fWhiskers.setAttribute('transform', `translate(0,${f1(bob * 0.5)})`);
    const colors = ['#e94b4b', '#ffcc33', '#3fa7e0'];
    const streams = (x0, y0, dir) => colors.map((c, j) => {
      const pts = [];
      for (let i = 0; i <= 7; i++) {
        pts.push([x0 + dir * i * (9 + j), y0 + i * (2 + j * 1.6) + 5 * Math.sin(ph * 1.3 - i * 0.8 + j) * i / 7]);
      }
      return `<path d="${ribbon(pts, 6, 3)}" fill="${c}"/>`;
    }).join('');
    pEls.fStreamL.innerHTML = streams(F_PLUG[0], F_PLUG[1], -1);
    pEls.fStreamR.innerHTML = streams(800 - F_PLUG[0], F_PLUG[1], 1);
  }

  // ---------- Loop ----------
  function render() {
    if (view === 'side') renderSide(); else renderPersp();
    $('readout').textContent = `${speedKey[0].toUpperCase() + speedKey.slice(1)} · ${(v / 10).toFixed(1)} km/h · ${(dist / 1000).toFixed(2)} km`;
    $('fade').setAttribute('opacity', Math.max(0, fadeT).toFixed(2));
  }
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      t += dt;
      v += (SPEEDS[speedKey] - v) * Math.min(1, dt * 2.5);
      dist += v * dt;
    }
    fadeT -= dt * 3.5;
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Controls ----------
  function setView(nv) {
    if (nv !== view) fadeT = 0.8;
    view = nv;
    $('sideScene').style.display = view === 'side' ? '' : 'none';
    $('perspScene').style.display = view === 'side' ? 'none' : '';
    pEls.behind.style.display = view === 'behind' ? '' : 'none';
    pEls.fpv.style.display = view === 'fpv' ? '' : 'none';
    document.querySelectorAll('#viewSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  }
  function setSpeed(ns) {
    speedKey = ns;
    document.querySelectorAll('#speedSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.speed === speedKey));
  }
  function togglePause() {
    paused = !paused;
    $('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
  }
  document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  document.querySelectorAll('#speedSeg button').forEach(b => b.addEventListener('click', () => setSpeed(b.dataset.speed)));
  $('pauseBtn').addEventListener('click', togglePause);
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.key === '1') setView('fpv');
    else if (e.key === '2') setView('behind');
    else if (e.key === '3') setView('side');
    else if (e.key === 'ArrowUp') { setSpeed(ORDER[Math.min(2, ORDER.indexOf(speedKey) + 1)]); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { setSpeed(ORDER[Math.max(0, ORDER.indexOf(speedKey) - 1)]); e.preventDefault(); }
    else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { togglePause(); e.preventDefault(); }
  });

  // expose for testing / embedding
  window.catRide = { setView, setSpeed, get state() { return { view, speedKey, v, dist }; } };

  setView('side');
  setSpeed('medium');
  fadeT = 0;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
