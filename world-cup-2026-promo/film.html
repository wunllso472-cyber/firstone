<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>2026 Promo</title>
<style>
  @font-face { font-family: 'Inter Tight'; font-weight: 300; src: url(fonts/InterTight-300-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 500; src: url(fonts/InterTight-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 700; src: url(fonts/InterTight-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 800; src: url(fonts/InterTight-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Inter Tight'; font-weight: 900; src: url(fonts/InterTight-900-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url(fonts/InstrumentSerif-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(fonts/InstrumentSerif-400-italic.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script src="film.js"></script>
<script>
  // Preview in a browser: plays in real time with score.wav if present. The renderer calls FILM.render directly.
  if (!/render/.test(location.hash)) window.ready.then(() => {
    const a = new Audio('score.wav'); let t0 = null;
    addEventListener('click', () => { t0 = performance.now(); a.currentTime = 0; a.play().catch(() => {}); });
    const loop = () => { const t = t0 === null ? 0 : ((performance.now() - t0) / 1000) % FILM.DURATION; FILM.render(t); requestAnimationFrame(loop); };
    loop();
  });
</script>
</body>
</html>
