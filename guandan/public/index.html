<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b3b36">
<title>欢乐掼蛋 · 四人在线</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">

    <!-- ================= HOME / HALL ================= -->
    <section id="scr-home" class="screen active">
      <div class="hall-bg"><div class="hall-rays"></div><div class="hall-clouds"></div></div>
      <header class="hall-top">
        <div class="me-card" id="homeProfile" title="修改昵称和头像">
          <div class="avatar" id="homeAvatar"></div>
          <div class="me-info">
            <div class="me-name" id="homeName">玩家</div>
            <div class="me-sub"><span class="bean"></span><span>欢乐豆 88,888</span></div>
          </div>
          <div class="edit-pen">✎</div>
        </div>
        <div class="hall-online"><i class="dot"></i>在线 <b id="onlineCount">0</b> 人</div>
        <div class="hall-tools">
          <button class="icon-btn" data-act="rules" title="规则"><span>规则</span></button>
          <button class="icon-btn" data-act="settings" title="设置"><span>设置</span></button>
        </div>
      </header>

      <div class="hall-main">
        <div class="logo">
          <div class="logo-word"><span>掼</span><span>蛋</span></div>
          <div class="logo-sub">欢 乐 四 人 · 在 线 对 局</div>
        </div>
        <div class="mode-row">
          <button class="mode mode-quick" data-act="quick">
            <div class="mode-art"><div class="fan"><i></i><i></i><i></i><i></i></div></div>
            <div class="mode-title">快速开始</div>
            <div class="mode-desc">自动匹配空闲房间</div>
          </button>
          <button class="mode mode-create" data-act="create">
            <div class="mode-art"><div class="house"></div></div>
            <div class="mode-title">创建房间</div>
            <div class="mode-desc">邀请好友 组队开黑</div>
          </button>
          <button class="mode mode-join" data-act="joinCode">
            <div class="mode-art"><div class="keypad"><i>1</i><i>2</i><i>3</i><i>4</i></div></div>
            <div class="mode-title">加入房间</div>
            <div class="mode-desc">输入六位房间号</div>
          </button>
          <button class="mode mode-bot" data-act="practice">
            <div class="mode-art"><div class="robot"></div></div>
            <div class="mode-title">人机练习</div>
            <div class="mode-desc">和电脑过招 随时开局</div>
          </button>
        </div>
      </div>

      <aside class="room-list">
        <div class="rl-head"><span>房间列表</span><button class="mini-btn" data-act="refresh">刷新</button></div>
        <div class="rl-body" id="roomList"><div class="rl-empty">暂时没有房间，快去创建一个吧</div></div>
      </aside>
      <div class="hall-foot">经典规则 · 逢人配 · 进贡还贡 · 过A获胜</div>
    </section>

    <!-- ================= TABLE ================= -->
    <section id="scr-game" class="screen">
      <div class="table-bg">
        <div class="felt"></div>
        <div class="table-logo"><span>掼蛋</span><em id="centerLvl">打 2</em></div>
      </div>

      <!-- top-left: level board -->
      <div class="lvl-board" id="lvlBoard">
        <div class="lb-row lb-cur"><span class="lb-k">本局打</span><span class="lb-v" id="lbCur">2</span></div>
        <div class="lb-row lb-teams">
          <div class="lb-team us"><span>我方</span><b id="lbUs">2</b></div>
          <div class="lb-team them"><span>对方</span><b id="lbThem">2</b></div>
        </div>
        <div class="lb-row lb-round" id="lbRound">第 1 局</div>
      </div>

      <!-- card counter (记牌器) -->
      <div class="counter" id="counter"></div>

      <!-- top-right: menu -->
      <div class="top-menu">
        <div class="room-tag" id="roomTag">房间 000000</div>
        <button class="tm-btn" data-act="sound" id="btnSound" title="声音"><i class="ico ico-sound"></i></button>
        <button class="tm-btn" data-act="rules" title="规则"><i class="ico ico-rules"></i></button>
        <button class="tm-btn" data-act="settings" title="设置"><i class="ico ico-set"></i></button>
        <button class="tm-btn" data-act="exit" title="退出"><i class="ico ico-exit"></i></button>
      </div>

      <!-- players: pos 0 = me(bottom) 1 = right 2 = top(partner) 3 = left -->
      <div class="seat pos1" data-pos="1"></div>
      <div class="seat pos2" data-pos="2"></div>
      <div class="seat pos3" data-pos="3"></div>
      <div class="seat pos0" data-pos="0"></div>

      <!-- played cards per position -->
      <div class="play-area pa1" data-pos="1"></div>
      <div class="play-area pa2" data-pos="2"></div>
      <div class="play-area pa3" data-pos="3"></div>
      <div class="play-area pa0" data-pos="0"></div>

      <!-- center notices -->
      <div class="notice" id="notice"></div>

      <!-- waiting room center panel -->
      <div class="wait-panel" id="waitPanel">
        <div class="wp-code">房间号 <b id="wpCode">000000</b></div>
        <div class="wp-tip" id="wpTip">等待玩家加入…</div>
        <div class="wp-btns">
          <button class="btn btn-blue" data-act="invite">邀请好友</button>
          <button class="btn btn-green" data-act="fillBots">电脑补位</button>
          <button class="btn btn-orange" id="btnReady" data-act="ready">准 备</button>
        </div>
      </div>

      <!-- action buttons -->
      <div class="actions" id="actions">
        <button class="btn btn-blue act-pass" data-act="pass">不 出</button>
        <button class="btn btn-green act-hint" data-act="hint">提 示</button>
        <button class="btn btn-orange act-play" data-act="play">出 牌</button>
      </div>
      <div class="actions tribute-acts" id="tributeActs">
        <div class="ta-tip">请选择一张 <b>10 及以下</b> 的牌还贡</div>
        <button class="btn btn-orange" data-act="returnTribute">还 贡</button>
      </div>
      <div class="clock" id="clock"><span>15</span></div>

      <!-- hand -->
      <div class="hand" id="hand"></div>
      <div class="partner-hand" id="partnerHand"></div>

      <!-- side tools -->
      <div class="side-tools" id="sideTools">
        <button class="st-btn" data-act="sflush"><i class="ico ico-sf"></i><span>同花顺</span></button>
        <button class="st-btn" data-act="arrange"><i class="ico ico-arr"></i><span id="arrLabel">理牌</span></button>
        <button class="st-btn" data-act="sortMode"><i class="ico ico-sort"></i><span>排序</span></button>
        <button class="st-btn" data-act="chat"><i class="ico ico-chat"></i><span>聊天</span></button>
      </div>
      <button class="host-btn" data-act="hosted" id="btnHosted"><i class="robot-ico"></i><span>托管</span></button>
      <div class="hosted-mask" id="hostedMask"><div class="hm-box"><div class="robot big"></div><div>托管中，电脑正在帮您出牌</div><button class="btn btn-orange" data-act="unhost">取消托管</button></div></div>

      <div class="fx-layer" id="fx"></div>
    </section>

    <!-- ================= OVERLAYS ================= -->
    <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
    <div class="toast" id="toast"></div>
    <div class="conn-bar" id="connBar">正在连接服务器…</div>
  </div>
</div>

<script src="engine.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
